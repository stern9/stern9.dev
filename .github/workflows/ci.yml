name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Redeploys main without a new commit
  workflow_dispatch:

# Default for every job; each job also states its own so none relies on the repo default
permissions:
  contents: read

jobs:
  build:
    # Matches the droplet (Ubuntu 24.04 x64, Node 24.22.1). Node itself is not shipped; the
    # release's only native code is sharp's prebuilt linux-x64 binary, which deploy.sh checks for
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Pinned to commit SHAs; Dependabot (github-actions ecosystem) keeps them current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the GA ID in a release that will deploy
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
        run: |
          if [ -z "$NEXT_PUBLIC_GA_ID" ]; then
            echo "::error::Set the repository variable NEXT_PUBLIC_GA_ID; without it the deployed site has no analytics"
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Blocks on high/critical advisories in production deps; dev-only tooling never ships
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      # npm run build, not next build, so prebuild steps run too. NEXT_PUBLIC_* values are
      # inlined here, so the build that ships needs the GA ID (a repository variable)
      - run: npm run build
        env:
          NEXT_PUBLIC_GA_ID: ${{ vars.NEXT_PUBLIC_GA_ID }}
      # Packed on every run so a broken release fails the PR, not the deploy
      - name: Package the release
        run: scripts/package-release.sh "$GITHUB_SHA" release.tgz
      - name: Upload the release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: release.tgz
          if-no-files-found: error
          # Already gzipped; kept a week so a failed deploy job can be re-run
          compression-level: 0
          retention-days: 7

  # The SSH key can only run scripts/deploy.sh on the droplet (forced command in
  # authorized_keys); that script holds the swap, the health check and the rollback.
  # It is sent the commit to deploy, and the release CI built for it on stdin.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The deploy key can run any release as stern9, so its secrets belong to this environment,
    # whose deployment branches are limited to main
    environment: Production
    timeout-minutes: 30
    # Needs only its secrets and this run's release artifact: no checkout, no API calls
    permissions: {}
    # Each run deploys its own commit, so a waiting deploy is never cancelled
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
      - name: Run the deploy script on the droplet
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and DEPLOY_HOST must all be set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The forced command accepts one full sha and nothing else, and reads the release from
          # stdin; its exit code is the step's
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "stern9@$DEPLOY_HOST" "$DEPLOY_SHA" \
            < release.tgz
      - name: Check the site from outside
        # Retries ride out a brief blip (DNS, TLS, a 5xx while the proxy settles) without
        # hiding a real outage: at most ~2.5 minutes (6 tries of <=20s, 5s apart) before failing
        run: >-
          curl -fsS -o /dev/null --connect-timeout 10 --max-time 20
          --retry 5 --retry-delay 5 --retry-all-errors
          https://stern9.dev/
