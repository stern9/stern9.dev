name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Redeploys main without a new commit
  workflow_dispatch:

# Default for every job; each job also states its own so none relies on the repo default
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Pinned to commit SHAs; Dependabot (github-actions ecosystem) keeps them current
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - run: npm ci
      # Blocks on high/critical advisories in production deps; dev-only tooling never ships
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm run build

  # The SSH key can only run scripts/deploy.sh on the droplet (forced command in
  # authorized_keys); that script holds the build, the health check and the rollback.
  # The one thing sent is the commit to deploy.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Needs only its secrets: no checkout, no API calls
    permissions: {}
    # Each run deploys its own commit, so a waiting deploy is never cancelled
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Run the deploy script on the droplet
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ] || [ -z "$DEPLOY_KNOWN_HOSTS" ] || [ -z "$DEPLOY_HOST" ]; then
            echo "::error::DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS and DEPLOY_HOST must all be set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The forced command accepts one full sha and nothing else; its exit code is the step's
          ssh -T -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "stern9@$DEPLOY_HOST" "$DEPLOY_SHA"
      - name: Check the site from outside
        # Retries ride out a brief blip (DNS, TLS, a 5xx while the proxy settles) without
        # hiding a real outage: about a minute in total before the step fails
        run: >-
          curl -fsS -o /dev/null --connect-timeout 10 --max-time 20
          --retry 5 --retry-delay 5 --retry-all-errors
          https://stern9.dev/
