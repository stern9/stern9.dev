# /etc/nginx/sites-enabled/stern9.dev
# Needs ops/nginx/conf.d/stern9-limits.conf (zones + cache path) installed in
# /etc/nginx/conf.d/. See ops/nginx/README.md for apply and rollback.

# HTTP → HTTPS redirect (and send www → apex)
server {
  listen 80;
  listen [::]:80;
  server_name stern9.dev www.stern9.dev;
  return 301 https://stern9.dev$request_uri;
}

# HTTPS app proxy (apex)
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name stern9.dev;

  ssl_certificate     /etc/letsencrypt/live/stern9.dev/fullchain.pem; # managed by Certbot
  ssl_certificate_key /etc/letsencrypt/live/stern9.dev/privkey.pem;    # managed by Certbot
  include /etc/letsencrypt/options-ssl-nginx.conf;                     # managed by Certbot
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;                       # managed by Certbot

  # Proxy headers shared by / and the /api/ locations (moved up from
  # location / so the new locations inherit them). The static locations below
  # still set their own Host, exactly as before. lib/rateLimit.ts trusts the
  # LAST X-Forwarded-For entry, which $proxy_add_x_forwarded_for appends.
  proxy_http_version 1.1;
  proxy_set_header   Upgrade $http_upgrade;
  proxy_set_header   Connection "upgrade";
  proxy_set_header   Host $host;
  proxy_set_header   X-Real-IP $remote_addr;
  proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header   X-Forwarded-Proto $scheme;

  # Rejected by limit_req / limit_conn → 429 instead of the default 503.
  limit_req_status   429;
  limit_conn_status  429;

  # Main app
  location / {
    proxy_pass         http://127.0.0.1:3000;
    proxy_read_timeout 90;
  }

  # API catch-all: per-IP rate limit (5 r/s, bursts of 20 served at once).
  # API bodies are small JSON; 32k leaves headroom over the app's 16kb limit.
  location /api/ {
    limit_req            zone=stern9_api burst=20 nodelay;
    client_max_body_size 32k;
    proxy_pass           http://127.0.0.1:3000;
    proxy_read_timeout   90;
  }

  # POST endpoints: the general limit plus a strict one (6/min, burst 5), and
  # at most 3 concurrent requests per IP. Doofus streams its reply, so no
  # buffering (the app also sends X-Accel-Buffering: no), never cached, and a
  # long read timeout. proxy_cache is off by default here.
  location ~ ^/api/(doofus|send)$ {
    limit_req            zone=stern9_api burst=20 nodelay;
    limit_req            zone=stern9_post burst=5 nodelay;
    limit_conn           stern9_conn 3;
    client_max_body_size 32k;
    proxy_pass           http://127.0.0.1:3000;
    proxy_buffering      off;
    proxy_read_timeout   300s;
  }

  # Short shared cache. TTLs come only from the app's Cache-Control
  # (s-maxage, else max-age); no proxy_cache_valid, so responses without
  # cache headers, "no-store"/"private" ones and anything with Set-Cookie are
  # never stored. Only GET/HEAD are cached (the default). Client Cache-Control
  # is ignored, so visitors can't force a Spotify call. proxy_cache_lock
  # collapses concurrent misses into one upstream request. Expired entries
  # are refreshed in the background only within the app's
  # stale-while-revalidate window ("updating" is left out of use_stale so an
  # hours-old now-playing is never served); if the app is down or erroring,
  # the last good copy is served instead of a 5xx. /api/og is included so it
  # works whether it renders, redirects or 404s after #9.
  location ~ ^/api/(now-playing|top-tracks|og)$ {
    limit_req                   zone=stern9_api burst=20 nodelay;
    proxy_pass                  http://127.0.0.1:3000;
    proxy_read_timeout          90;
    proxy_cache                 stern9_cache;
    proxy_cache_key             $scheme$host$request_uri;
    proxy_cache_lock            on;
    proxy_cache_lock_timeout    10s;
    proxy_cache_use_stale       error timeout http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    add_header                  X-Cache-Status $upstream_cache_status always;
  }

  # Next.js static chunks & CSS (cache long)
  location /_next/static/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_read_timeout 90;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Your own /static/ directory (if you use it)
  location /static/ {
    proxy_pass         http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    proxy_read_timeout 90;
    expires 1y;
    access_log off;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}

# Optional: dedicated www on HTTPS that always redirects to apex
server {
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.stern9.dev;

  ssl_certificate     /etc/letsencrypt/live/stern9.dev/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/stern9.dev/privkey.pem;
  include /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://stern9.dev$request_uri;
}
