# http-level zones for stern9.dev. Installs to /etc/nginx/conf.d/, which
# nginx.conf includes inside http {} before sites-enabled/*.
# Every name is prefixed "stern9_" so nothing clashes with ours-budget.
# Only zones are declared here; nothing applies until a location uses them,
# so other server blocks are unaffected.

# General per-IP rate for everything under /api/.
limit_req_zone $binary_remote_addr zone=stern9_api:10m rate=5r/s;

# Stricter per-IP rate for the POST endpoints (Doofus, contact form). The app
# keeps its own finer limits and daily budgets; this only stops floods before
# they reach Node.
limit_req_zone $binary_remote_addr zone=stern9_post:10m rate=6r/m;

# Concurrent requests per IP (a Doofus stream holds its request open).
limit_conn_zone $binary_remote_addr zone=stern9_conn:10m;

# Small shared cache for the Spotify endpoints and /api/og. 1m of keys holds
# ~8k entries; 50m on disk is plenty for JSON and a few PNGs on a 2 GB box.
proxy_cache_path /var/cache/nginx/stern9 levels=1:2 keys_zone=stern9_cache:1m
                 max_size=50m inactive=1d use_temp_path=off;
